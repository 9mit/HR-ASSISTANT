[project]
name = "hr-ranking-system"
version = "1.0.0"
description = "Production-grade bias-free HR candidate ranking system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.3",
  "uvicorn[standard]>=0.49.0",
  "sqlalchemy>=2.0.23",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.1.0",
  "python-multipart>=0.0.27",
  "requests>=2.33.0",
  "beautifulsoup4>=4.12.2",
  "lxml>=6.1.1",
  "pypdf>=6.13.2",
  "python-docx>=0.8.11",
  "spacy>=3.7.2",
  "scikit-learn>=1.9.0",
  "sentence-transformers>=5.5.1",
  "transformers>=5.12.0",
  "torch>=2.12.0",
  "email-validator>=2.1.0",
  "aiosmtplib>=3.0.1",
  "python-json-logger>=2.0.7",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.25.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["talentlens*"]
